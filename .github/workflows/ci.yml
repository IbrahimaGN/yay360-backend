# Intégration continue de l'API YAY360 (Spring Boot 3, Java 21, PostgreSQL).
# Construit, teste et vérifie l'image Docker à chaque push et pull request.
# Aucun déploiement ici : la livraison reste une décision humaine.

name: CI backend

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule l'exécution en cours sur la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-unitaires:
    name: Compilation et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw est versionné sans le bit exécutable (dépôt créé sous Windows).
      - run: chmod +x mvnw

      # Les tests unitaires (JUnit 5 + Mockito) n'ont besoin ni de base ni de secret.
      - name: Compiler, tester et empaqueter
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-unitaires
          path: target/surefire-reports/
          retention-days: 7

      - name: Archive JAR
        uses: actions/upload-artifact@v4
        with:
          name: yay360-api-${{ github.sha }}
          path: target/*.jar
          retention-days: 14

  tests-integration:
    name: Tests d'intégration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: tests-unitaires
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yay360_it
          POSTGRES_USER: postgres
          # Base jetable, détruite à la fin du job : ce mot de passe n'est pas un secret.
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yay360_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YAY360_IT_DATASOURCE_URL: jdbc:postgresql://localhost:5432/yay360_it
      YAY360_IT_DATASOURCE_PASSWORD: postgres-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: chmod +x mvnw

      # Contexte Spring complet : Flyway, filtre JWT et @PreAuthorize sur une vraie base.
      - name: Sécurité de bout en bout
        run: ./mvnw -B -ntp test -Dtest=SecuriteIntegrationIT -Dsurefire.failIfNoSpecifiedTests=false

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-integration
          path: target/surefire-reports/
          retention-days: 7

  image-docker:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: tests-unitaires
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Vérifie que le Dockerfile construit ; l'image n'est pas publiée.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: yay360-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  qualite-sonarqube:
    name: Qualité du code (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: tests-unitaires
    timeout-minutes: 20
    # Désactivé tant que la variable SONAR_ORGANIZATION n'est pas définie dans le dépôt.
    if: ${{ vars.SONAR_ORGANIZATION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : SonarQube Cloud en a besoin pour attribuer le nouveau code.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: chmod +x mvnw

      # Compile, lance les tests unitaires et produit le rapport de couverture JaCoCo.
      - name: Tests et couverture
        run: ./mvnw -B -ntp verify

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
