# Analyse SonarQube Cloud de l'API YAY360.
# L'organisation est fournie par la CI (variable GitHub SONAR_ORGANIZATION).
# Clé du projet : celle affichée par SonarQube Cloud à l'import du dépôt.
sonar.projectKey=IbrahimaGN_yay360-backend
sonar.projectName=YAY360 - API

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8
