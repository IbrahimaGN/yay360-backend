# Analyse SonarQube Cloud de l'API YAY360.
# L'organisation est fournie par la CI (variable GitHub SONAR_ORGANIZATION).
# Clé du projet : celle affichée par SonarQube Cloud à l'import du dépôt.
sonar.projectKey=IbrahimaGN_yay360-backend
sonar.projectName=YAY360 - API

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8

# Exclus de la couverture :
# - scripts/ : outils de vérification locale, jamais livrés en production ;
# - SecurityConfig : vérifiée de bout en bout par SecuriteIntegrationIT (job « Tests d'intégration »),
#   dont la couverture n'est pas remontée par JaCoCo.
sonar.coverage.exclusions=scripts/**,src/main/java/sn/yay360/api/config/SecurityConfig.java

# Détection des duplications : entités JPA et DTO (déclarations de champs et de contraintes
# de validation de même forme) et contenu éditorial des 40 semaines dans DataInitializer.
sonar.cpd.exclusions=src/main/java/sn/yay360/api/model/**,src/main/java/sn/yay360/api/dto/**,src/main/java/sn/yay360/api/config/DataInitializer.java
